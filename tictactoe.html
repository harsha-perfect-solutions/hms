<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe • Unbeatable AI & PvP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090D16;
      --card-bg: rgba(30, 41, 59, 0.7);
      --border: rgba(255, 255, 255, 0.1);
      --cyan: #06B6D4;
      --cyan-glow: rgba(6, 182, 212, 0.4);
      --pink: #F43F5E;
      --pink-glow: rgba(244, 63, 94, 0.4);
      --primary: #6366F1;
      --text: #F8FAFC;
      --muted: #94A3B8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', -apple-system, sans-serif;
      background: radial-gradient(ellipse at top, #1E1B4B 0%, #090D16 70%, #020617 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justifyContent: center;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }
    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 1;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #A5B4FC;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }
    h1 {
      font-size: 2.5rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #FFFFFF, #94A3B8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.25rem;
    }
    .subtitle {
      font-size: 0.875rem;
      color: var(--muted);
      margin-bottom: 1.25rem;
    }
    .mode-bar {
      width: 100%;
      display: flex;
      gap: 0.5rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 0.35rem;
      border-radius: 14px;
      backdrop-filter: blur(10px);
      margin-bottom: 1rem;
    }
    .mode-btn {
      flex: 1;
      border: none;
      padding: 0.6rem;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.825rem;
      cursor: pointer;
      background: transparent;
      color: var(--muted);
      transition: all 0.2s;
    }
    .mode-btn.active {
      background: linear-gradient(135deg, #4F46E5, #3730A3);
      color: #FFFFFF;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35);
    }
    .difficulty-bar {
      width: 100%;
      display: flex;
      gap: 0.5rem;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      padding: 0.25rem;
      border-radius: 10px;
      margin-bottom: 1rem;
    }
    .diff-btn {
      flex: 1;
      border: none;
      padding: 0.4rem;
      border-radius: 7px;
      font-weight: 700;
      font-size: 0.75rem;
      cursor: pointer;
      background: transparent;
      color: var(--muted);
      transition: all 0.15s;
    }
    .diff-btn.active {
      background: #6366F1;
      color: #FFFFFF;
    }
    .scoreboard {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .score-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.65rem 0.4rem;
      text-align: center;
      backdrop-filter: blur(8px);
    }
    .score-label {
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 0.05em;
    }
    .score-val {
      font-size: 1.4rem;
      font-weight: 900;
      margin-top: 0.15rem;
    }
    .status-banner {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.75rem;
      text-align: center;
      font-weight: 800;
      font-size: 0.95rem;
      margin-bottom: 1.25rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
      transition: all 0.2s;
    }
    .board {
      width: 100%;
      max-width: 360px;
      aspect-ratio: 1 / 1;
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 10px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      margin-bottom: 1.25rem;
    }
    .cell {
      background: rgba(30, 41, 59, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 2.8rem;
      font-weight: 900;
      user-select: none;
      transition: all 0.15s ease;
    }
    .cell:hover:not(.occupied):not(.disabled) {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
    }
    .cell.x {
      color: var(--cyan);
      text-shadow: 0 0 16px var(--cyan-glow);
    }
    .cell.o {
      color: var(--pink);
      text-shadow: 0 0 16px var(--pink-glow);
    }
    .cell.winning {
      animation: pulse 1s infinite alternate;
      border-color: #FFFFFF;
    }
    .cell.winning.x {
      background: rgba(6, 182, 212, 0.3);
      box-shadow: 0 0 25px var(--cyan-glow);
    }
    .cell.winning.o {
      background: rgba(244, 63, 94, 0.3);
      box-shadow: 0 0 25px var(--pink-glow);
    }
    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.05); }
    }
    .btn-row {
      width: 100%;
      max-width: 360px;
      display: flex;
      gap: 0.75rem;
    }
    .btn-primary {
      flex: 1;
      border: none;
      padding: 0.75rem;
      border-radius: 12px;
      background: linear-gradient(135deg, #4F46E5, #3730A3);
      color: #FFFFFF;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.4);
      transition: all 0.2s;
    }
    .btn-secondary {
      border: 1px solid var(--border);
      padding: 0.75rem 1rem;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--muted);
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    canvas#confetti {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
    }
  </style>
</head>
<body>
  <canvas id="confetti"></canvas>
  <div class="container">
    <div class="badge">BREAK ROOM • GAME ARENA</div>
    <h1>Tic-Tac-Toe</h1>
    <p class="subtitle">Play against unbeatable Minimax AI or 2 Players</p>

    <!-- Mode Selector -->
    <div class="mode-bar">
      <button class="mode-btn active" id="modeAiBtn" onclick="setMode('ai')">🤖 vs AI Bot</button>
      <button class="mode-btn" id="modePvpBtn" onclick="setMode('pvp')">👥 2 Players (PvP)</button>
    </div>

    <!-- AI Difficulty -->
    <div class="difficulty-bar" id="diffBar">
      <button class="diff-btn" id="diffEasy" onclick="setDiff('easy')">Easy</button>
      <button class="diff-btn" id="diffMed" onclick="setDiff('medium')">Medium</button>
      <button class="diff-btn active" id="diffHard" onclick="setDiff('hard')">Unbeatable</button>
    </div>

    <!-- Scoreboard -->
    <div class="scoreboard">
      <div class="score-card">
        <div class="score-label" style="color: #38BDF8;">PLAYER X</div>
        <div class="score-val" id="scoreX">0</div>
      </div>
      <div class="score-card">
        <div class="score-label" style="color: #94A3B8;">TIES</div>
        <div class="score-val" id="scoreDraw">0</div>
      </div>
      <div class="score-card">
        <div class="score-label" style="color: #FB7185;" id="playerOLabel">BOT O</div>
        <div class="score-val" id="scoreO">0</div>
      </div>
      <div class="score-card">
        <div class="score-label" style="color: #FBBF24;">STREAK</div>
        <div class="score-val" id="scoreStreak" style="color: #FDE047;">0</div>
      </div>
    </div>

    <!-- Status Banner -->
    <div class="status-banner" id="statusBanner">
      Current Turn: <span style="color: var(--cyan);" id="turnDisplay">X</span>
    </div>

    <!-- 3x3 Board -->
    <div class="board" id="board">
      <div class="cell" data-idx="0" onclick="handleClick(0)"></div>
      <div class="cell" data-idx="1" onclick="handleClick(1)"></div>
      <div class="cell" data-idx="2" onclick="handleClick(2)"></div>
      <div class="cell" data-idx="3" onclick="handleClick(3)"></div>
      <div class="cell" data-idx="4" onclick="handleClick(4)"></div>
      <div class="cell" data-idx="5" onclick="handleClick(5)"></div>
      <div class="cell" data-idx="6" onclick="handleClick(6)"></div>
      <div class="cell" data-idx="7" onclick="handleClick(7)"></div>
      <div class="cell" data-idx="8" onclick="handleClick(8)"></div>
    </div>

    <!-- Actions -->
    <div class="btn-row">
      <button class="btn-primary" onclick="resetRound()">New Round</button>
      <button class="btn-secondary" onclick="resetScores()">Reset Scores</button>
    </div>
  </div>

  <script>
    // Audio Synthesizer
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function playBeep(freq, type = 'sine', duration = 0.12) {
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    // Game State
    let board = Array(9).fill(null);
    let turn = 'X';
    let winner = null;
    let mode = 'ai';
    let diff = 'hard';
    let scores = { x: 0, o: 0, draws: 0, streak: 0 };
    let aiThinking = false;

    const WIN_COMBOS = [
      [0,1,2], [3,4,5], [6,7,8],
      [0,3,6], [1,4,7], [2,5,8],
      [0,4,8], [2,4,6]
    ];

    function checkWin(b) {
      for (const [a, c, d] of WIN_COMBOS) {
        if (b[a] && b[a] === b[c] && b[a] === b[d]) return { winner: b[a], line: [a, c, d] };
      }
      if (b.every(x => x !== null)) return { winner: 'draw', line: null };
      return { winner: null, line: null };
    }

    function minimax(b, depth, isMax) {
      const res = checkWin(b);
      if (res.winner === 'O') return { score: 10 - depth };
      if (res.winner === 'X') return { score: depth - 10 };
      if (res.winner === 'draw') return { score: 0 };

      const avail = b.map((v, i) => v === null ? i : null).filter(v => v !== null);
      if (isMax) {
        let max = -Infinity, best = avail[0];
        for (const idx of avail) {
          b[idx] = 'O';
          const r = minimax(b, depth + 1, false);
          b[idx] = null;
          if (r.score > max) { max = r.score; best = idx; }
        }
        return { score: max, index: best };
      } else {
        let min = Infinity, best = avail[0];
        for (const idx of avail) {
          b[idx] = 'X';
          const r = minimax(b, depth + 1, true);
          b[idx] = null;
          if (r.score < min) { min = r.score; best = idx; }
        }
        return { score: min, index: best };
      }
    }

    function getAiMove(b) {
      const avail = b.map((v, i) => v === null ? i : null).filter(v => v !== null);
      if (avail.length === 0) return -1;
      if (diff === 'easy') return avail[Math.floor(Math.random() * avail.length)];
      if (diff === 'medium') {
        for (const i of avail) {
          b[i] = 'O'; if (checkWin(b).winner === 'O') { b[i] = null; return i; } b[i] = null;
        }
        for (const i of avail) {
          b[i] = 'X'; if (checkWin(b).winner === 'X') { b[i] = null; return i; } b[i] = null;
        }
        if (b[4] === null) return 4;
        return avail[Math.floor(Math.random() * avail.length)];
      }
      return minimax(b, 0, true).index;
    }

    function render() {
      const cells = document.querySelectorAll('.cell');
      cells.forEach((cell, i) => {
        cell.className = 'cell';
        cell.textContent = board[i] || '';
        if (board[i]) {
          cell.classList.add('occupied', board[i].toLowerCase());
        }
        if (winner || aiThinking) cell.classList.add('disabled');
      });

      const res = checkWin(board);
      if (res.line) {
        res.line.forEach(i => {
          cells[i].classList.add('winning', res.winner.toLowerCase());
        });
      }

      const banner = document.getElementById('statusBanner');
      if (winner) {
        if (winner === 'draw') {
          banner.innerHTML = "🤝 It's a Draw!";
          banner.style.borderColor = '#94A3B8';
        } else {
          banner.innerHTML = `🎉 Player ${winner} Wins!`;
          banner.style.borderColor = winner === 'X' ? 'var(--cyan)' : 'var(--pink)';
        }
      } else if (aiThinking) {
        banner.innerHTML = "🤖 AI Bot is thinking...";
        banner.style.borderColor = '#FBBF24';
      } else {
        banner.innerHTML = `Current Turn: <span style="color: ${turn === 'X' ? 'var(--cyan)' : 'var(--pink)'};">${turn}</span>`;
        banner.style.borderColor = 'var(--border)';
      }

      document.getElementById('scoreX').textContent = scores.x;
      document.getElementById('scoreO').textContent = scores.o;
      document.getElementById('scoreDraw').textContent = scores.draws;
      document.getElementById('scoreStreak').textContent = scores.streak;
    }

    function handleClick(idx) {
      if (board[idx] || winner || aiThinking) return;
      playBeep(turn === 'X' ? 523 : 659);
      board[idx] = turn;
      const res = checkWin(board);
      if (res.winner) {
        winner = res.winner;
        if (winner === 'draw') {
          scores.draws++;
          scores.streak = 0;
          playBeep(200, 'sawtooth', 0.25);
        } else {
          if (winner === 'X') { scores.x++; scores.streak++; } else { scores.o++; scores.streak = 0; }
          playWinSound();
          confettiEffect();
        }
        render();
        return;
      }

      turn = turn === 'X' ? 'O' : 'X';
      render();

      if (mode === 'ai' && turn === 'O') {
        aiThinking = true;
        render();
        setTimeout(() => {
          const aiIdx = getAiMove(board);
          if (aiIdx !== -1) {
            playBeep(659);
            board[aiIdx] = 'O';
            const aiRes = checkWin(board);
            if (aiRes.winner) {
              winner = aiRes.winner;
              if (winner === 'draw') { scores.draws++; scores.streak = 0; }
              else { scores.o++; scores.streak = 0; playWinSound(); }
            } else {
              turn = 'X';
            }
          }
          aiThinking = false;
          render();
        }, 300);
      }
    }

    function playWinSound() {
      [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => playBeep(f, 'triangle', 0.2), i * 100));
    }

    function resetRound() {
      board = Array(9).fill(null);
      turn = 'X';
      winner = null;
      aiThinking = false;
      render();
    }

    function resetScores() {
      resetRound();
      scores = { x: 0, o: 0, draws: 0, streak: 0 };
      render();
    }

    function setMode(m) {
      mode = m;
      document.getElementById('modeAiBtn').classList.toggle('active', m === 'ai');
      document.getElementById('modePvpBtn').classList.toggle('active', m === 'pvp');
      document.getElementById('diffBar').style.display = m === 'ai' ? 'flex' : 'none';
      document.getElementById('playerOLabel').textContent = m === 'ai' ? 'BOT O' : 'PLAYER O';
      resetRound();
    }

    function setDiff(d) {
      diff = d;
      document.getElementById('diffEasy').classList.toggle('active', d === 'easy');
      document.getElementById('diffMed').classList.toggle('active', d === 'medium');
      document.getElementById('diffHard').classList.toggle('active', d === 'hard');
      resetRound();
    }

    function confettiEffect() {
      const c = document.getElementById('confetti');
      const ctx = c.getContext('2d');
      c.width = window.innerWidth;
      c.height = window.innerHeight;
      const p = Array.from({ length: 80 }, () => ({
        x: c.width / 2 + (Math.random() - 0.5) * 200,
        y: c.height / 2 + (Math.random() - 0.5) * 100,
        vx: (Math.random() - 0.5) * 12,
        vy: (Math.random() - 0.5) * 12 - 4,
        size: Math.random() * 8 + 4,
        color: ['#06B6D4', '#F43F5E', '#10B981', '#F59E0B', '#8B5CF6'][Math.floor(Math.random() * 5)],
        alpha: 1
      }));
      let f = 0;
      function anim() {
        ctx.clearRect(0, 0, c.width, c.height);
        let active = false;
        p.forEach(pt => {
          pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.2; pt.alpha -= 0.015;
          if (pt.alpha > 0) {
            active = true;
            ctx.globalAlpha = Math.max(0, pt.alpha);
            ctx.fillStyle = pt.color;
            ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
          }
        });
        f++;
        if (active && f < 100) requestAnimationFrame(anim);
        else ctx.clearRect(0, 0, c.width, c.height);
      }
      anim();
    }

    // Number keys 1-9 support
    window.addEventListener('keydown', (e) => {
      const k = parseInt(e.key, 10);
      if (k >= 1 && k <= 9) handleClick(k - 1);
    });

    render();
  </script>
</body>
</html>
